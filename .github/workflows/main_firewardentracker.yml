  # Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
  # More GitHub Actions for Azure: https://github.com/Azure/actions

  name: Build and deploy Node.js app to Azure Web App - firewardentracker

  on:
    push:
      branches:
        - main
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      permissions:
        contents: read #This is required for actions/checkout

      steps:
        - uses: actions/checkout@v4

        - name: Set up Node.js version
          uses: actions/setup-node@v3
          with:
            node-version: '24.x'

        - name: npm install, build, and test
          run: |
            npm install
            cd client && npm install
            cd ..
            npm run build --if-present
            npm run test --if-present
          env:
            CI: false
        - name: Upload artifact for deployment job
          uses: actions/upload-artifact@v4
          with:
            name: node-app
            path: .

    deploy:
      runs-on: ubuntu-latest
      needs: build
      permissions:
        id-token: write #This is required for requesting the JWT
        contents: read #This is required for actions/checkout

      steps:
        - name: Download artifact from build job
          uses: actions/download-artifact@v4
          with:
            name: node-app

        - name: Login to Azure
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6E2CA21C0BA241AAB5601705A7874791 }}
            tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BDFDCA0E75934D72B19832E8C818DEFF }}
            subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C72A0788BEEA4C4CB64C65BACDE96CA7 }}

        - name: 'Deploy to Azure Web App'
          id: deploy-to-webapp
          uses: azure/webapps-deploy@v3
          with:
            app-name: 'firewardentracker'
            slot-name: 'Production'
            package: .

